name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

  issue_comment:
    types: [created]

  pull_request_review_comment:
    types: [created]

jobs:
  ai-review:
    if: |
      github.event_name == 'pull_request' ||
      contains(github.event.comment.body, 'oc review') ||
      contains(github.event.comment.body, '/oc review') ||
      contains(github.event.comment.body, '/opencode review')

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get PR information
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number || github.event.issue.number }}"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          gh pr diff "$PR_NUMBER" > pr_diff.txt
          gh pr view "$PR_NUMBER" --json title,body,headRefName,baseRefName > pr_info.json

      - name: Review with Gemini
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          with open("pr_diff.txt", "r", encoding="utf-8") as f:
              diff = f.read()

          prompt = """You are reviewing a GitHub pull request.

          Analyze the provided diff carefully for:
          - bugs
          - off-by-one errors
          - null/None handling problems
          - division by zero
          - security problems
          - logic errors
          - breaking changes
          - important code-quality issues

          Focus especially on finding real bugs introduced by this PR.

          Be concise. If you find a real problem:
          1. Clearly identify the problematic code/change.
          2. Explain why it is a bug.
          3. Give a specific fix.

          If there are no significant problems, say so.

          Pull request diff:
          """ + diff[:50000]

          data = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ]
          }

          api_key = os.environ["GOOGLE_GENERATIVE_AI_API_KEY"]

          url = (
              "https://generativelanguage.googleapis.com/v1beta/models/"
              "gemini-3.6-flash:generateContent?key=" + api_key
          )

          req = urllib.request.Request(
              url,
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req, timeout=120) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as e:
              error_body = e.read().decode("utf-8", errors="replace")
              print("Gemini API error:")
              print(error_body)
              raise

          candidates = result.get("candidates", [])
          text = ""

          if candidates:
              parts = candidates[0].get("content", {}).get("parts", [])
              text = "\n".join(
                  part.get("text", "")
                  for part in parts
                  if part.get("text")
              )

          if not text:
              text = "Gemini returned no review text."

          with open("review.txt", "w", encoding="utf-8") as f:
              f.write(text)
          PY

      - name: Post review to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --body-file review.txt
